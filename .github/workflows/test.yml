name: Test

on:
  push:
  workflow_dispatch:

# The token only needs to read the code. Uploading the artifact uses the runner's own credentials, not this token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Separate steps so a flaky failure does not skip the unit tests.
      - run: bun run test:flaky
        continue-on-error: true
      - run: bun run test:unit
        continue-on-error: true
      # A bare <testsuite> root and a non-XML file, so ingesters see every shape they must handle.
      - name: Add extra artifact files
        if: always()
        run: |
          mkdir -p test-results
          cp fixtures/legacy-testsuite.xml test-results/legacy-testsuite.xml
          echo "Not a JUnit report; ingesters must skip this file." > test-results/notes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: test-results/
