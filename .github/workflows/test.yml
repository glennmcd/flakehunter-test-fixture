name: Test

on:
  push:
  workflow_dispatch:

# The token only needs to read the code. Uploading the artifact uses the runner's own credentials, not this token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: junit.xml
